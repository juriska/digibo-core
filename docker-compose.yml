version: '3.8'

services:
  oracle:
    image: container-registry.oracle.com/database/express:latest
    container_name: oracle-xe
    environment:
      - ORACLE_PWD=MySecurePass123
      - ORACLE_CHARACTERSET=AL32UTF8
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    shm_size: '2gb'
    restart: unless-stopped

volumes:
  oracle-data: 